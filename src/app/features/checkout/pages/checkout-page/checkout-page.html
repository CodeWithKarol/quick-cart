<div class="bg-secondary-50 min-h-screen pt-16 pb-12 px-4 sm:px-6 lg:px-8">
  <div class="mx-auto max-w-7xl lg:grid lg:grid-cols-2 lg:gap-x-12 xl:gap-x-16">
    <!-- Checkout Form (Left Column) -->
    <div class="lg:col-start-1">
      <!-- Steps -->
      <app-checkout-steps
        [steps]="steps"
        [currentStep]="currentStep()"
        (stepClick)="goToStep($any($event))"
      ></app-checkout-steps>

      <form [formGroup]="checkoutForm" (ngSubmit)="onSubmit()">
        @switch (currentStep()) {
          @case ('information') {
            <app-checkout-personal-info
              [form]="checkoutForm"
              (fillMockData)="fillMockData()"
              (continue)="nextStep()"
            ></app-checkout-personal-info>
          }
          @case ('shipping') {
            <app-checkout-delivery
              [deliveryMethod]="deliveryMethod()"
              (deliveryMethodChange)="setDeliveryMethod($event)"
              (continue)="nextStep()"
              (back)="prevStep()"
            ></app-checkout-delivery>
          }
          @case ('payment') {
            <app-checkout-payment
              [form]="checkoutForm"
              [billingSameAsShipping]="billingSameAsShipping()"
              [total]="total()"
              [isProcessing]="isProcessing"
              (billingSameAsShippingChange)="billingSameAsShipping.set($event)"
              (back)="prevStep()"
            ></app-checkout-payment>
          }
        }
      </form>
    </div>

    <!-- Order Summary (Right Column on Desktop) -->
    <div class="mt-12 lg:mt-0 lg:col-start-2">
      <div class="lg:sticky lg:top-20">
        <h2 class="text-xl font-medium font-display text-primary-900 mb-6 lg:mb-0">
          Order summary
        </h2>
        <app-checkout-order-summary
          [cartItems]="cartItems()"
          [cartTotal]="cartTotal()"
          [shippingCost]="shippingCost()"
          [discount]="discount()"
          [total]="total()"
          [deliveryDates]="deliveryDates()"
          [appliedPromo]="appliedPromo()"
          [promoError]="promoError()"
          (applyPromoCode)="applyPromo($event)"
        ></app-checkout-order-summary>
      </div>
    </div>
  </div>
</div>
