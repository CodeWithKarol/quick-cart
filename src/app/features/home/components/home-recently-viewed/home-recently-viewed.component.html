@if (hasItems()) {
  <section class="bg-primary-50 py-24 sm:py-32">
    <div class="mx-auto max-w-7xl px-6 lg:px-8">
      <div class="mb-12">
        <h2 class="text-2xl font-bold tracking-tight text-primary-900 font-display">
          Recently Viewed
        </h2>
        <p class="mt-2 text-primary-600 font-light italic">Picking up where you left off.</p>
      </div>

      <div class="grid grid-cols-1 gap-y-12 gap-x-6 sm:grid-cols-2 lg:grid-cols-4">
        @for (product of products(); track product.id) {
          <app-product-card
            [product]="product"
            (addToCart)="addToCart.emit($event)"
            (quickView)="quickView.emit($event)"
          />
        }
      </div>
    </div>
  </section>
}
