<section class="bg-white py-24 sm:py-32">
  <div class="mx-auto max-w-7xl px-6 lg:px-8">
    <div class="mx-auto max-w-2xl lg:text-center mb-16">
      <h2 class="text-base font-semibold leading-7 text-accent-600 tracking-widest uppercase">
        The Collections
      </h2>
      <p class="mt-2 text-3xl font-bold tracking-tight text-primary-900 sm:text-4xl font-display">
        Explore by Category
      </p>
    </div>
    <div class="grid grid-cols-1 gap-y-12 sm:grid-cols-2 lg:grid-cols-3 sm:gap-x-8">
      @for (category of categories; track category.name) {
        <a [routerLink]="category.link" class="group relative block">
          <div class="relative aspect-[4/5] overflow-hidden bg-primary-100 rounded-3xl">
            <img
              [src]="category.image"
              [alt]="category.name"
              class="h-full w-full object-cover object-center transition-transform duration-[1500ms] group-hover:scale-110"
            />
            <!-- Overlay -->
            <div
              class="absolute inset-0 bg-primary-900/5 transition-colors duration-500 group-hover:bg-primary-900/20"
            ></div>

            <!-- Description Box (Glassmorphism) -->
            <div
              class="absolute bottom-6 left-6 right-6 translate-y-8 opacity-0 transition-all duration-700 ease-out group-hover:translate-y-0 group-hover:opacity-100 z-10"
            >
              <div
                class="bg-white/90 backdrop-blur-xl p-6 shadow-2xl border border-white/40 rounded-2xl"
              >
                <p class="text-primary-900 text-sm font-medium leading-relaxed italic">
                  "{{ category.description }}"
                </p>
                <div
                  class="mt-4 flex items-center text-accent-600 text-[10px] font-bold tracking-[0.2em] uppercase"
                >
                  Discover Now
                  <svg
                    class="ml-2 h-3.5 w-3.5 transition-transform duration-300 group-hover:translate-x-1"
                    fill="none"
                    viewBox="0 0 24 24"
                    stroke="currentColor"
                  >
                    <path
                      stroke-linecap="round"
                      stroke-linejoin="round"
                      stroke-width="2"
                      d="M17 8l4 4m0 0l-4 4m4-4H3"
                    />
                  </svg>
                </div>
              </div>
            </div>
          </div>

          <div class="mt-8 px-2">
            <h3
              class="text-3xl font-bold text-primary-900 font-display flex items-center group-hover:text-primary-700 transition-colors"
            >
              {{ category.name }}
              <span
                class="ml-4 h-px flex-1 bg-primary-100 origin-left scale-x-0 transition-transform duration-500 group-hover:scale-x-100"
              ></span>
              <svg
                class="ml-4 h-6 w-6 text-primary-300 transform -rotate-45 transition-all duration-500 group-hover:rotate-0 group-hover:text-primary-900"
                fill="none"
                viewBox="0 0 24 24"
                stroke="currentColor"
              >
                <path
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  stroke-width="2"
                  d="M17 8l4 4m0 0l-4 4m4-4H3"
                />
              </svg>
            </h3>
          </div>
        </a>
      }
    </div>
  </div>
</section>
